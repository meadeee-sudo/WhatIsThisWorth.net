<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WhatIsThisWorth</title>

<style>
body { font-family: Arial; max-width: 900px; margin: 40px auto; background:#fafafa; }
.card { background:#fff; padding:18px; border-radius:10px; margin-top:15px; }
h1 { text-align:center; }
input { width:60%; padding:12px; }
button { padding:12px; background:black; color:white; border:none; }

.bar {
  height:10px;
  background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);
  border-radius:6px;
  margin-top:10px;
  position:relative;
}

.dot {
  width:12px; height:12px; background:white;
  border:2px solid black; border-radius:50%;
  position:absolute; top:-2px;
}

.comp { font-size:13px; margin-top:6px; padding-left:8px; border-left:3px solid #ddd; }

.small { font-size:12px; color:#666; }
</style>
</head>

<body>

<h1>WhatIsThisWorth</h1>

<div style="text-align:center;">
  <input id="q" placeholder="iPhone 15, Jordan 1, LEGO set">
  <button onclick="go()">Estimate</button>
</div>

<div id="out"></div>

<script>
async function go() {
  let q = document.getElementById("q").value;

  let res = await fetch("https://whatisthisworth-net.onrender.com/search?q=" + encodeURIComponent(q));
  let data = await res.json();

  let band = data.valuation_band || {};
  let comps = data.comps || [];

  let min = band.min || 0;
  let max = band.max || 1;
  let med = band.median || 0;

  let pos = ((med - min) / (max - min)) * 100;

  let compHTML = comps.map(c =>
    `<div class="comp">💰 $${c.price} — <a href="${c.url}" target="_blank">${c.title}</a></div>`
  ).join("");

  let hist = (data.histogram || []).map(h =>
    `<div style="height:${h*6}px;width:15px;background:#3b82f6;display:inline-block;margin-right:3px;"></div>`
  ).join("");

  document.getElementById("out").innerHTML = `
    <div class="card">
      <h2>${data.estimated_value}</h2>

      <div class="small">
        Range: ${data.range} <br>
        Sales: ${data.sales_found} <br>
        Confidence: ${data.confidence} <br>
        Accuracy: ${data.accuracy_score}%
      </div>

      <div class="bar">
        <div class="dot" style="left:${pos}%"></div>
      </div>

      <h3>Price Distribution</h3>
      ${hist}

      <h3>Recent Sales</h3>
      ${compHTML}
    </div>
  `;
}
</script>

</body>
</html>
