font-style: italic;
    }
  </style>
</head>

<body>

  <h1>What Is This Worth?</h1>
  <p>Instant resale value estimates based on recent :contentReference[oaicite:0]{index=0} sales data.</p>

  <div class="search-box">
    <input id="search" placeholder="e.g. Nike Jordan 1, vintage toy, iPhone 12" />
    <button onclick="searchItem()">Estimate</button>
  </div>

  <div id="results"></div>

  <script>
    async function searchItem() {
      const query = document.getElementById("search").value;
      const results = document.getElementById("results");

      if (!query) {
        results.innerHTML = "<div class='card'>Enter an item name.</div>";
        return;
      }

      results.innerHTML = "<div class='card loading'>Analyzing recent sales...</div>";

      try {
        const res = await fetch(
          "https://YOUR-BACKEND-URL/search?q=" + encodeURIComponent(query)
        );

        if (!res.ok) throw new Error("API error");

        const data = await res.json();

        results.innerHTML = `
          <div class="card">
            <div class="price">${data.estimated_value}</div>

            <div class="range">
              Typical range: ${data.range}
            </div>

            <div class="meta">
              Based on ${data.sales_found} recent sales
              <br>
              Market trend: stable (demo)
            </div>
          </div>
        `;

      } catch (e) {
        results.innerHTML =
          "<div class='card'>Could not fetch data. Try again.</div>";
      }
    }
  </script>

</body>
</html>
